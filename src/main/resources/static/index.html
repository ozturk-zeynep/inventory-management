<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inventory Management Panel</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        :root {
            --bg-color: #f0f2f5;
            --card-bg: #ffffff;
            --text-color: #212529;
            --border-color: #dee2e6;
            --title-blue: #0d6efd; 
        }

        /* dark mode */
        body.dark-mode {
            --bg-color: #0f0f0f;
            --card-bg: #181818;
            --text-color: #ffffff !important; 
            --border-color: #333333;
        }

        body { 
            background-color: var(--bg-color); 
            color: var(--text-color);
            transition: all 0.3s ease;
            padding: 20px;
            font-family: 'Segoe UI', system-ui, sans-serif;
        }

        .container { 
            background: var(--card-bg); 
            padding: 30px; 
            border-radius: 12px; 
            box-shadow: 0 8px 24px rgba(0,0,0,0.3); 
            border: 1px solid var(--border-color);
        }

        /*title ve total product kısmı */
        .text-primary { color: var(--title-blue) !important; }
        .bg-custom-blue { background-color: var(--title-blue) !important; color: white !important; font-weight: bold; }

        /* tablo ayarları */
        .table { color: var(--text-color) !important; border-color: var(--border-color); }
        .table td, .table th { 
            color: var(--text-color) !important; 
            background-color: transparent !important; 
            border-bottom-color: var(--border-color) !important;
        }
        
        body.dark-mode .table-dark { --bs-table-bg: #222; }

        
        .card { background-color: var(--card-bg) !important; border-color: var(--border-color) !important; }
        .card-header { background-color: #212529 !important; color: white !important; }

        .form-control { 
            background-color: var(--bg-color) !important; 
            color: var(--text-color) !important; 
            border: 1px solid var(--border-color) !important; 
        }

        
        .form-control::placeholder { color: #888 !important; opacity: 1; }

        .critical-stock { color: #ff4d4d !important; font-weight: bold; }
        .table-warning-custom { background-color: rgba(255, 193, 7, 0.1) !important; }

        .btn-outline-danger { color: #ff6b6b; border-color: #ff6b6b; }
        .btn-outline-danger:hover { background-color: #ff6b6b; color: white; }
    </style>
</head>
<body>

<div class="container">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2 class="text-primary fw-bold m-0">Inventory Management Panel</h2>
        <div>
            <button onclick="toggleDarkMode()" class="btn btn-outline-secondary btn-sm me-2" id="themeBtn">Night Mode</button>
            <span class="badge bg-custom-blue py-2 px-3 shadow-sm" id="totalItems">Total: 0 Products</span>
        </div>
    </div>

    <div class="card mb-4 shadow-sm">
        <div class="card-header">Search</div>
        <div class="card-body p-3">
            <input type="text" id="searchInput" class="form-control" placeholder="Search products..." onkeyup="filterProducts()">
        </div>
    </div>

    <div class="card mb-4 shadow-sm">
        <div class="card-header">Add New Product</div>
        <div class="card-body">
            <form id="productForm" class="row g-2">
                <div class="col-md-5">
                    <input type="text" id="name" class="form-control" placeholder="Product Name" required>
                </div>
                <div class="col-md-2">
                    <input type="number" id="stock" class="form-control" placeholder="Stock" required>
                </div>
                <div class="col-md-3">
                    <div class="input-group">
                        <input type="number" step="0.01" id="price" class="form-control" placeholder="Unit Price" required>
                        <span class="input-group-text bg-dark text-white border-secondary">₺</span>
                    </div>
                </div>
                <div class="col-md-2">
                    <button type="submit" class="btn btn-success w-100 shadow-sm">Add</button>
                </div>
                <input type="hidden" id="catId" value="1">
                <input type="hidden" id="supplierId" value="1">
            </form>
        </div>
    </div>

    <div class="table-responsive">
        <table class="table align-middle">
            <thead class="table-dark">
                <tr>
                    <th>ID</th>
                    <th>Product Name</th>
                    <th>Stock Quantity</th>
                    <th>Unit Price</th>
                    <th>Status</th>
                    <th class="text-center">Actions</th>
                </tr>
            </thead>
            <tbody id="productTableBody">
                </tbody>
        </table>
    </div>
</div>


<script>
    const API_URL = '/api/products';

    function loadProducts() {
        fetch(API_URL)
            .then(res => res.json())
            .then(data => {
                const tbody = document.getElementById('productTableBody');
                document.getElementById('totalItems').textContent = `Total: ${data.length} Products`;
                tbody.innerHTML = '';
                
                data.forEach(p => {
                    const isCritical = p.stockQuantity < 10;
                    const rowClass = isCritical ? 'table-warning-custom' : '';
                    const stockClass = isCritical ? 'critical-stock' : '';

                    tbody.innerHTML += `
                        <tr class="${rowClass}">
                            <td>${p.productId}</td>
                            <td><strong>${p.productName}</strong></td>
                            <td class="${stockClass}">
                                ${p.stockQuantity} Units ${isCritical ? '⚠️' : ''}
                            </td>
                            <td>${p.unitPrice.toLocaleString('tr-TR')} ₺</td>
                            <td>
                                <span class="badge ${p.isActive ? 'bg-success' : 'bg-secondary'}">
                                    ${p.isActive ? 'Active' : 'Inactive'}
                                </span>
                            </td>
                            <td class="text-center">
                                <button onclick="deleteProduct(${p.productId})" class="btn btn-outline-danger btn-sm">Delete</button>
                            </td>
                        </tr>`;
                });
            });
    }

    function filterProducts() {
        const term = document.getElementById('searchInput').value.toLowerCase();
        const rows = document.querySelectorAll('#productTableBody tr');
        rows.forEach(row => {
            const name = row.querySelector('td:nth-child(2)').textContent.toLowerCase();
            row.style.display = name.includes(term) ? '' : 'none';
        });
    }

    function toggleDarkMode() {
        const body = document.body;
        const btn = document.getElementById('themeBtn');
        body.classList.toggle('dark-mode');
        
        if (body.classList.contains('dark-mode')) {
            localStorage.setItem('theme', 'dark');
            btn.innerHTML = "Light Mode";
        } else {
            localStorage.setItem('theme', 'light');
            btn.innerHTML = "Night Mode";
        }
    }

    document.getElementById('productForm').addEventListener('submit', function(e) {
        e.preventDefault();
        const product = {
            productName: document.getElementById('name').value,
            stockQuantity: parseInt(document.getElementById('stock').value),
            unitPrice: parseFloat(document.getElementById('price').value),
            categoryId: 1, supplierId: 1, isActive: true
        };

        fetch(API_URL, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(product)
        }).then(() => {
            this.reset();
            loadProducts();
        });
    });

    function deleteProduct(id) {
        if(confirm('Are you sure you want to delete this product?')) {
            fetch(`${API_URL}/${id}`, { method: 'DELETE' })
                .then(res => res.text())
                .then(msg => {
                    const enMsg = msg.includes("silindi") ? "Product status updated." : msg;
                    alert(enMsg);
                    loadProducts();
                });
        }
    }

    
    if (localStorage.getItem('theme') === 'dark') {
        document.body.classList.add('dark-mode');
        document.getElementById('themeBtn').innerHTML = "Light Mode";
    }
    loadProducts();
</script>

</body>
</html>
